<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="pragma" content="no-cache">

    <title>Agendamento | Rivi Silva Esmalteria</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body { background-color: #FFFFFF; font-family: 'Montserrat', sans-serif; background-image: radial-gradient(at 10% 10%, rgba(212, 175, 55, 0.05) 0px, transparent 50%); overflow-x: hidden; }
        .gold-text { color: #D4AF37; }
        .gold-bg { background: linear-gradient(135deg, #D4AF37 0%, #F5E6A3 100%); }
        .gold-border { border-color: #D4AF37; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <div class="max-w-md mx-auto w-full bg-white rounded-[2.5rem] p-6 md:p-8 shadow-2xl border border-zinc-100 my-auto relative">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black italic uppercase tracking-wider text-zinc-900">Rivi Silva <span class="gold-text">Esmalteria</span></h1>
            <p class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest mt-1">Selecione o procedimento e o horário</p>
        </div>

        <div class="mb-6">
            <label class="block text-[10px] font-black text-zinc-400 uppercase tracking-widest mb-2">Data do Atendimento</label>
            <input type="date" id="dataInput" class="w-full p-4 bg-zinc-50 border border-zinc-200 rounded-2xl font-bold text-xs outline-none focus:border-[#D4AF37] transition-all">
        </div>

        <div class="mb-6">
            <label class="block text-[10px] font-black text-zinc-400 uppercase tracking-widest mb-2">Serviços</label>
            <div id="servicosContainer" class="space-y-2 max-h-40 overflow-y-auto pr-1 custom-scroll">
                </div>
        </div>

        <div class="mb-6">
            <label class="block text-[10px] font-black text-zinc-400 uppercase tracking-widest mb-2">Horários Disponíveis</label>
            <div id="horariosContainer" class="grid grid-cols-3 gap-2 max-h-36 overflow-y-auto p-1 custom-scroll bg-zinc-50 rounded-2xl border border-zinc-100">
                <span class="col-span-3 text-center text-xs text-zinc-400 py-4 font-bold">Selecione uma data</span>
            </div>
        </div>

        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-[9px] font-black text-zinc-400 uppercase tracking-widest mb-1">Seu Nome</label>
                <input type="text" id="nomeCliente" placeholder="EX: MARIA SILVA" class="w-full p-4 bg-zinc-50 border border-zinc-200 rounded-2xl text-[10px] font-black uppercase outline-none focus:border-[#D4AF37]">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[9px] font-black text-zinc-400 uppercase tracking-widest mb-1">WhatsApp</label>
                    <input type="tel" id="telCliente" placeholder="(71) 99999-9999" class="w-full p-4 bg-zinc-50 border border-zinc-200 rounded-2xl text-[10px] font-black outline-none focus:border-[#D4AF37]">
                </div>
                <div>
                    <label class="block text-[9px] font-black text-zinc-400 uppercase tracking-widest mb-1">Aniversário (Dia/Mês)</label>
                    <input type="text" id="aniversarioCliente" maxLength="5" placeholder="EX: 25/08" class="w-full p-4 bg-zinc-50 border border-zinc-200 rounded-2xl text-[10px] font-black outline-none focus:border-[#D4AF37]">
                </div>
            </div>
        </div>

        <div class="bg-zinc-900 text-white p-4 rounded-2xl flex justify-between items-center mb-6">
            <span class="text-[10px] font-black uppercase text-[#D4AF37]">Total:</span>
            <span id="totalDisplay" class="font-black italic text-lg">R$ 0,00</span>
        </div>

        <button id="btnAgendar" onclick="realizarAgendamento()" class="w-full py-5 gold-bg text-black font-black uppercase text-[11px] tracking-[0.2em] rounded-2xl shadow-xl hover:opacity-90 transition-all flex items-center justify-center gap-2">
            <span id="btnText">Agendar Horário 💅</span>
        </button>

    </div>

    <footer class="text-center py-4">
        <p class="text-[10px] font-bold text-zinc-400 uppercase tracking-[0.3em]">© 2026 Rivi Silva Style</p>
    </footer>

    <script>
        const supabaseUrl = 'https://rahubkowehwtvditbhlx.supabase.co';
        const supabaseKey = 'sb_publishable_wKbs4gYVURdIR6Cafm8qFA_tUZZTIKo';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let servicosDb = [];
        let servicosSelecionados = [];
        let dataSelecionada = '';
        let horaSelecionada = '';

        async function init() {
            const hoje = new Date().toISOString().split('T')[0];
            const dataInput = document.getElementById('dataInput');
            dataInput.value = hoje;
            dataInput.min = hoje;
            dataSelecionada = hoje;

            dataInput.addEventListener('change', (e) => {
                dataSelecionada = e.target.value;
                carregarHorarios();
            });

            // Máscara de aniversário
            const anivInput = document.getElementById('aniversarioCliente');
            anivInput.addEventListener('input', (e) => {
                let v = e.target.value.replace(/\D/g, "");
                if (v.length > 4) v = v.substring(0, 4);
                if (v.length > 2) v = v.substring(0, 2) + "/" + v.substring(2);
                e.target.value = v;
            });

            await carregarServicos();
            await carregarHorarios();
        }

        async function carregarServicos() {
            const { data } = await _supabase.from('servicos').select('*').order('nome');
            if (data) {
                servicosDb = data;
                renderServicos();
            }
        }

        function renderServicos() {
            const container = document.getElementById('servicosContainer');
            container.innerHTML = '';
            servicosDb.forEach(s => {
                const isSelected = servicosSelecionados.some(item => item.nome === s.nome);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `w-full p-3 rounded-xl text-[10px] font-black uppercase text-left border flex justify-between items-center transition-all ${isSelected ? 'bg-amber-50 gold-border gold-text shadow-sm' : 'bg-zinc-50 border-zinc-100 text-zinc-400'}`;
                btn.innerHTML = `<span>${s.nome}</span> <span class="font-bold">R$ ${Number(s.preco).toFixed(2).replace('.', ',')}</span>`;
                btn.onclick = () => {
                    if (isSelected) {
                        servicosSelecionados = servicosSelecionados.filter(item => item.nome !== s.nome);
                    } else {
                        servicosSelecionados.push(s);
                    }
                    renderServicos();
                    atualizarTotal();
                };
                container.appendChild(btn);
            });
        }

        function atualizarTotal() {
            const total = servicosSelecionados.reduce((acc, s) => acc + Number(s.preco || 0), 0);
            document.getElementById('totalDisplay').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        async function carregarHorarios() {
            const container = document.getElementById('horariosContainer');
            container.innerHTML = '<span class="col-span-3 text-center text-xs text-zinc-400 py-4 font-bold">Carregando horários...</span>';

            // 1. Verificar se o dia está bloqueado por inteiro
            const { data: bloqueioDia } = await _supabase.from('agenda_bloqueada').select('*').eq('data_interditada', dataSelecionada).maybeSingle();
            if (bloqueioDia) {
                container.innerHTML = '<span class="col-span-3 text-center text-xs text-red-500 font-black py-4 uppercase">Agenda Fechada / Indisponível nesta data</span>';
                return;
            }

            // 2. Buscar horários já agendados para este dia
            const { data: agendados } = await _supabase.from('agendamentos').select('horario').eq('data_atendimento', dataSelecionada);
            const horariosOcupados = (agendados || []).map(a => a.horario.slice(0, 5));

            // 3. Buscar horários pontuais inativados pelo painel admin (ex: 12:00)
            const { data: inativadosData } = await _supabase.from('horarios_bloqueados_pontuais').select('horario').eq('data', dataSelecionada);
            const horariosInativados = (inativadosData || []).map(i => i.horario.slice(0, 5));

            // 4. Buscar configuração de expediente (padrão ou exceção do dia)
            let inicio = '09:00';
            let fim = '18:00';
            let intervalo = 40;

            const { data: configGeral } = await _supabase.from('agenda_config').select('*').eq('id', 1).maybeSingle();
            if (configGeral) {
                inicio = configGeral.hora_inicio.slice(0, 5);
                fim = configGeral.hora_fim.slice(0, 5);
                intervalo = configGeral.intervalo_minutos;
            }

            const { data: excecaoDia } = await _supabase.from('agenda_excecoes').select('*').eq('data', dataSelecionada).maybeSingle();
            if (excecaoDia) {
                inicio = excecaoDia.hora_inicio.slice(0, 5);
                fim = excecaoDia.hora_fim.slice(0, 5);
            }

            // Gerar slots de horários
            const [hIni, mIni] = inicio.split(':').map(Number);
            const [hFim, mFim] = fim.split(':').map(Number);
            let minutosAtuais = hIni * 60 + mIni;
            const minutosFim = hFim * 60 + mFim;

            const slots = [];
            while (minutosAtuais < minutosFim) {
                const hh = String(Math.floor(minutosAtuais / 60)).padStart(2, '0');
                const mm = String(minutosAtuais % 60).padStart(2, '0');
                slots.push(`${hh}:${mm}`);
                minutosAtuais += intervalo;
            }

            container.innerHTML = '';
            if (slots.length === 0) {
                container.innerHTML = '<span class="col-span-3 text-center text-xs text-zinc-400 py-4 font-bold">Nenhum horário disponível.</span>';
                return;
            }

            slots.forEach(slot => {
                const isOcupado = horariosOcupados.includes(slot);
                const isInativadoAdmin = horariosInativados.includes(slot);
                const isIndisponivel = isOcupado || isInativadoAdmin;
                const isSelected = horaSelecionada === slot;

                const btn = document.createElement('button');
                btn.type = 'button';
                
                if (isIndisponivel) {
                    btn.className = 'p-3 rounded-xl text-xs font-black bg-red-100 text-red-500 border border-red-200 line-through cursor-not-allowed';
                    btn.disabled = true;
                    btn.innerText = slot;
                } else {
                    btn.className = `p-3 rounded-xl text-xs font-black transition-all border ${isSelected ? 'bg-zinc-900 text-[#D4AF37] border-zinc-900 shadow-md' : 'bg-white text-zinc-800 border-zinc-200 hover:border-[#D4AF37]'}`;
                    btn.innerText = slot;
                    btn.onclick = () => {
                        horaSelecionada = slot;
                        carregarHorarios();
                    };
                }
                container.appendChild(btn);
            });
        }

        async function realizarAgendamento() {
            const nome = document.getElementById('nomeCliente').value.trim();
            const tel = document.getElementById('telCliente').value.trim();
            const anivers = document.getElementById('aniversarioCliente').value.trim();

            if (!nome || !tel) return alert("Preencha seu nome e WhatsApp!");
            if (servicosSelecionados.length === 0) return alert("Selecione pelo menos um serviço!");
            if (!horaSelecionada) return alert("Selecione um horário disponível!");

            const btn = document.getElementById('btnAgendar');
            const btnText = document.getElementById('btnText');
            btn.disabled = true;
            btn.classList.add('opacity-50');
            btnText.innerText = "Agendando...";

            const totalStr = document.getElementById('totalDisplay').innerText;
            const servicosNomes = servicosSelecionados.map(s => s.nome).join(", ");
            const valorNumerico = parseFloat(totalStr.replace('R$ ', '').replace('.', '').replace(',', '.'));

            const { error } = await _supabase.from('agendamentos').insert([{
                cliente_nome: nome.toUpperCase(),
                telefone: tel,
                aniversario: anivers.length === 5 ? anivers : null,
                data_atendimento: dataSelecionada,
                horario: horaSelecionada,
                servico: servicosNomes,
                status: "Aguardando",
                valor: valorNumerico
            }]);

            if (!error) {
                const msg = `Agendamento Rivi Silva 💅\n\nNome: ${nome.toUpperCase()}\nData: ${dataSelecionada.split('-').reverse().join('/')}\nHora: ${horaSelecionada}\nServiços: ${servicosNomes}\nTotal: ${totalStr}\n\nEnvio meu comprovante para garantir o agendamento!`;
                window.location.href = `https://api.whatsapp.com/send?phone=5571992447638&text=${encodeURIComponent(msg)}`;
            } else {
                alert("Erro ao realizar agendamento. Tente novamente.");
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                btnText.innerText = "Agendar Horário 💅";
            }
        }

        init();
    </script>
</body>
</html>
